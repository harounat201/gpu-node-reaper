apiVersion: training.harouna.dev/v1alpha1
kind: TrainingJob
metadata:
  name: pytorch-resnet-job
  namespace: default
spec:
  # Select the pods that belong to this training job.
  # Any pod with these labels on a gpu-node=true node will be protected
  # from Karpenter disruption until the job completes.
  podSelector:
    matchLabels:
      app: pytorch-resnet
      role: worker

  # Optional overrides (these are the defaults)
  drainTimeout: 5m
  stallTimeout: 10m
  utilizationThreshold: 30
